<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルページ</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/script.js" defer></script>
</head>
<body>
<main class="card">
  <h1>サンプルページ</h1>
  <p>この HTML は <code>sample/html/thisis.html</code> に置かれていて、
     CSS・JS・画像を相対パス(<code>../css/</code>, <code>../js/</code>, <code>../img/</code>)で参照しています。</p>
  <img src="../img/logo.png" alt="サンプルロゴ" width="120" height="120">
  <p>
    <button id="btn" type="button">クリックしてカウント</button>
    <span id="count">0</span> 回
  </p>
  <p class="note">スタイルが効いてカードに影が付き、ボタンでカウントが増えれば、CSS と JS の読み込みは成功です。</p>
</main>
</body>
</html>
